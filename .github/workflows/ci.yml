name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          # `node --test` is given a glob pattern, which Node resolves itself
          # from 21 onward. Pinned to 22 to match local development.
          node-version: '22'
          cache: npm

      - run: npm ci

      - run: npm test
