name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          # `node --test` is given a glob pattern, which Node resolves itself
          # from 21 onward. Pinned to 22 to match local development.
          node-version: '22'
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm test

      # Coverage floors sit just below the current numbers so the ratchet
      # catches regressions; raise them as coverage improves.
      - name: Coverage
        run: >-
          node --test --experimental-test-coverage
          --test-coverage-exclude='tests/**'
          --test-coverage-lines=95
          --test-coverage-branches=87
          --test-coverage-functions=96
          'tests/**/*.test.mjs'
