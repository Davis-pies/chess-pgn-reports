name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          # `node --test` is given a glob pattern, which Node resolves itself
          # from 21 onward. Pinned to 22 to match local development.
          node-version: '22'
          cache: npm

      - run: npm ci

      - run: npm run lint

      # Fails the build on exports/files/dependencies nothing imports, so a
      # refactor cannot quietly leave dead code behind.
      - run: npm run knip

      - run: npm test

      # Coverage floors sit just below the current numbers so the ratchet
      # catches regressions; raise them as coverage improves.
      - name: Coverage
        run: >-
          node --test --experimental-test-coverage
          --test-coverage-exclude='tests/**'
          --test-coverage-lines=97
          --test-coverage-branches=87
          --test-coverage-functions=97
          'tests/**/*.test.mjs'

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # Only Chromium: the tests drive one browser, so there is no point
      # downloading the other two.
      - run: npx playwright install --with-deps chromium

      - run: npm run test:e2e

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
