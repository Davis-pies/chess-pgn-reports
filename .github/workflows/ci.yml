name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# A newer push to the same PR or branch makes the older run moot.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Lint and dead-code checks take seconds; running them beside the tests
  # reports a lint failure without waiting on the test suite.
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          # `node --test` is given a glob pattern, which Node resolves itself
          # from 21 onward. Pinned to 22 to match local development.
          node-version: '22'
          cache: npm

      - run: npm ci --no-audit --no-fund

      - run: npm run lint

      # Fails the build on exports/files/dependencies nothing imports, so a
      # refactor cannot quietly leave dead code behind.
      - run: npm run knip

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - run: npm ci --no-audit --no-fund

      # One pass runs every test and checks coverage; a failing test fails
      # this step, so a separate `npm test` run would only repeat the suite.
      # Coverage floors sit just below the current numbers so the ratchet
      # catches regressions; raise them in package.json as coverage improves.
      - name: Test with coverage
        run: npm run coverage:check
